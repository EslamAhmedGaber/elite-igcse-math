<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Trigonometry Lab - Elite Mathematics</title>
<meta name="description" content="Rotate the cuboid, change its size and watch the right-angled triangles behind every 3D Pythagoras and trigonometry question.">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#14254a; --royal:#2456c9; --sky:#dce8fb; --gold:#e2b84f; --ink:#1c2536; --muted:#56637a; --line:#d6e0f0; --green:#0e7c66; --red:#c2410c; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Sora, system-ui, sans-serif; color: var(--ink); background: #f6f8fc; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  header .mark { background: var(--navy); color: var(--gold); font-weight: 800; padding: 6px 10px; border-radius: 9px; font-size: 13px; }
  header a { color: var(--royal); font-weight: 700; text-decoration: none; margin-left: auto; font-size: 14px; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { margin: 4px 0 2px; font-size: clamp(26px, 4vw, 36px); color: var(--navy); }
  .lead { margin: 0 0 16px; color: var(--muted); }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--royal); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tabs button { min-height: 42px; padding: 0 16px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff; font: inherit; font-weight: 700; color: var(--navy); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--royal); border-color: var(--royal); color: #fff; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 16px; }
  .stage { position: relative; background: #fff; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; min-height: 460px; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .hint { position: absolute; left: 14px; bottom: 12px; font-size: 12.5px; color: var(--muted); background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 8px; }
  .spin { position: absolute; right: 12px; top: 12px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
  .spin[aria-pressed="true"] { background: var(--royal); border-color: var(--royal); color: #fff; }
  .label { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 15px; color: var(--navy); pointer-events: none; text-shadow: 0 0 4px #fff, 0 0 4px #fff; }
  .label.len { font-size: 13px; font-weight: 700; color: var(--royal); background: rgba(255,255,255,.9); padding: 1px 6px; border-radius: 6px; text-shadow: none; }
  .label.ang { color: var(--red); font-size: 13px; background: rgba(255,255,255,.9); padding: 1px 6px; border-radius: 6px; text-shadow: none; }
  .panel { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .question { background: var(--navy); color: #fff; border-radius: 14px; padding: 14px 16px; font-size: 15px; line-height: 1.5; }
  .question b { color: var(--gold); }
  .sliders { display: grid; gap: 8px; }
  .sliders label { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
  .sliders output { text-align: right; font-weight: 800; color: var(--royal); }
  input[type=range] { accent-color: var(--royal); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .steps li { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.55; opacity: .45; transition: opacity .2s, border-color .2s, background .2s; }
  .steps li.on { opacity: 1; border-color: var(--royal); background: #f3f7fe; }
  .steps li strong { color: var(--navy); }
  .steps .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--sky); color: var(--navy); font-weight: 800; font-size: 13px; margin-right: 6px; }
  .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; }
  .nav { display: flex; gap: 8px; }
  .nav button { flex: 1; min-height: 44px; border-radius: 11px; border: 0; font: inherit; font-weight: 700; cursor: pointer; }
  .prev { background: var(--sky); color: var(--navy); }
  .next { background: var(--royal); color: #fff; }
  .answer { border-radius: 12px; padding: 12px 14px; background: #e4f4ee; color: var(--green); font-weight: 800; font-size: 16px; display: none; }
  .answer.show { display: block; }
  .tip { font-size: 13.5px; color: var(--muted); border-left: 4px solid var(--gold); padding: 6px 10px; background: #fffaf0; border-radius: 6px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .stage { min-height: 380px; } }
</style>
</head>
<body>
<header>
  <span class="mark">ELITE</span><strong>Visual Lab</strong>
  <nav style="margin-left:auto;display:flex;gap:16px"><a href="index.html" style="margin:0">All labs</a><a href="../index.html" style="margin:0">&larr; All courses</a></nav>
</header>
<main>
  <span class="kicker">Linear OL-T50 · Modular Unit 1 · 3D Pythagoras &amp; Trigonometry</span>
  <h1>See the hidden right-angled triangle</h1>
  <p class="lead">Every 3D question is two flat triangles. Rotate the cuboid, change its size, then step through the method.</p>

  <div class="tabs" role="group" aria-label="Question type">
    <button type="button" data-mode="diag" aria-pressed="true">Space diagonal</button>
    <button type="button" data-mode="plane" aria-pressed="false">Angle with the base</button>
    <button type="button" data-mode="pyramid" aria-pressed="false">Pyramid height &amp; angle</button>
  </div>

  <div class="grid">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="labels"></div>
      <span class="hint">Drag to rotate · scroll or pinch to zoom</span>
      <button type="button" class="spin" id="spin" aria-pressed="false">&#9654; Spin</button>
    </div>
    <aside class="panel">
      <div class="question" id="question"></div>
      <div class="sliders" id="sliders"></div>
      <ol class="steps" id="steps"></ol>
      <div class="nav"><button class="prev" type="button" id="prev">&larr; Back</button><button class="next" type="button" id="next">Next step &rarr;</button></div>
      <div class="answer" id="answer"></div>
      <p class="tip" id="tip"></p>
    </aside>
  </div>
</main>

<script>
(function () {
  const cv = document.getElementById("cv"), stage = document.getElementById("stage"), labelsEl = document.getElementById("labels");
  const ctx = cv.getContext("2d");
  const state = { mode: "diag", step: 0, l: 8, w: 6, h: 5, yaw: -0.75, pitch: 0.42, zoom: 1 };
  const C = { navy: "#14254a", royal: "#2456c9", sky: "#dce8fb", gold: "#e2b84f", red: "#c2410c", green: "#0e7c66", edge: "#9fb2d4" };
  const f2 = (x) => (Math.round(x * 100) / 100).toString();
  const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const deg = (r) => r * 180 / Math.PI;

  // ---------- geometry ----------
  function shape() {
    const { l, w, h } = state;
    if (state.mode === "pyramid") {
      const P = { A: [0, 0, 0], B: [l, 0, 0], C: [l, w, 0], D: [0, w, 0], M: [l / 2, w / 2, 0], V: [l / 2, w / 2, h] };
      return { P, edges: [["A","B"],["B","C"],["C","D"],["D","A"],["V","A"],["V","B"],["V","C"],["V","D"]], faces: [["A","B","C","D"]], centre: [l / 2, w / 2, h / 2] };
    }
    const P = { A: [0, 0, 0], B: [l, 0, 0], C: [l, w, 0], D: [0, w, 0], E: [0, 0, h], F: [l, 0, h], G: [l, w, h], H: [0, w, h] };
    const edges = [["A","B"],["B","C"],["C","D"],["D","A"],["E","F"],["F","G"],["G","H"],["H","E"],["A","E"],["B","F"],["C","G"],["D","H"]];
    return { P, edges, faces: [["A","B","C","D"]], centre: [l / 2, w / 2, h / 2] };
  }

  // ---------- what each step shows ----------
  function plan() {
    const { l, w, h } = state;
    const base = Math.hypot(l, w), space = Math.hypot(base, h);
    if (state.mode === "diag") {
      return {
        q: `A cuboid has length <b>${l} cm</b>, width <b>${w} cm</b> and height <b>${h} cm</b>. Work out the length of the diagonal <b>AG</b>.`,
        steps: [
          { t: `<strong>Find the flat triangle on the base.</strong> AG goes through the inside, so first find <span class="math">AC</span> on the floor ABCD.`, tri: ["A","B","C"], hi: [["A","C"]] },
          { t: `<strong>Pythagoras on the base:</strong> <span class="math">AC² = ${l}² + ${w}² = ${l*l + w*w}</span>, so <span class="math">AC = ${f2(base)}</span> cm.`, tri: ["A","B","C"], hi: [["A","C"]], len: [["A","C", base]] },
          { t: `<strong>Stand AC up.</strong> Triangle ACG is right-angled at C because CG is vertical.`, tri: ["A","C","G"], grow: ["C","G"], hi: [["A","G"]], len: [["A","C", base], ["C","G", h]] },
          { t: `<strong>Pythagoras again:</strong> <span class="math">AG² = ${f2(base)}² + ${h}² = ${f2(base*base + h*h)}</span>, so <span class="math">AG = ${f2(space)}</span> cm.`, tri: ["A","C","G"], hi: [["A","G"]], len: [["A","C", base], ["C","G", h], ["A","G", space]] },
        ],
        answer: `AG = ${Number(space.toPrecision(3))} cm (3 s.f.)`,
        tip: `Shortcut: AG = √(l² + w² + h²). Write the two triangles anyway — the marks are for the method.`,
      };
    }
    if (state.mode === "plane") {
      const ang = deg(Math.atan2(h, base));
      return {
        q: `In the same cuboid (<b>${l}</b> × <b>${w}</b> × <b>${h}</b> cm), find the angle between the diagonal <b>AG</b> and the base <b>ABCD</b>.`,
        steps: [
          { t: `<strong>Drop a perpendicular.</strong> From G straight down to the base lands on C. The shadow of AG on the base is <span class="math">AC</span>.`, tri: ["A","C","G"], grow: ["C","G"], hi: [["A","C"], ["C","G"]] },
          { t: `<strong>The angle is between the line and its shadow:</strong> angle GAC, inside the right-angled triangle ACG.`, tri: ["A","C","G"], hi: [["A","G"]], angle: ["A", "C", "G"] },
          { t: `<strong>Find AC first:</strong> <span class="math">AC = √(${l}² + ${w}²) = ${f2(base)}</span> cm.`, tri: ["A","B","C"], hi: [["A","C"]], len: [["A","C", base]] },
          { t: `<strong>Choose TAN</strong> (opposite CG, adjacent AC): <span class="math">tan θ = ${h} ÷ ${f2(base)}</span>, so <span class="math">θ = ${f1(ang)}°</span>.`, tri: ["A","C","G"], hi: [["A","G"]], len: [["A","C", base], ["C","G", h]], angle: ["A", "C", "G"] },
        ],
        answer: `Angle GAC = ${f1(ang)}°`,
        tip: `Exam trap: the angle with a plane is never measured to a vertical edge. Always line → its shadow on the plane.`,
      };
    }
    const half = base / 2, slant = Math.hypot(half, h), ang = deg(Math.atan2(h, half));
    return {
      q: `A pyramid VABCD has a rectangular base <b>${l} cm</b> by <b>${w} cm</b>. V is <b>${h} cm</b> vertically above the centre M of the base. Find <b>VA</b> and the angle between VA and the base.`,
      steps: [
        { t: `<strong>Find the base diagonal:</strong> <span class="math">AC = √(${l}² + ${w}²) = ${f2(base)}</span> cm.`, tri: ["A","B","C"], hi: [["A","C"]], len: [["A","C", base]] },
        { t: `<strong>Half of it reaches the centre:</strong> <span class="math">AM = ${f2(base)} ÷ 2 = ${f2(half)}</span> cm.`, tri: null, hi: [["A","M"]], len: [["A","M", half]] },
        { t: `<strong>Triangle AMV is right-angled at M</strong> (VM is the vertical height). <span class="math">VA = √(${f2(half)}² + ${h}²) = ${f2(slant)}</span> cm.`, tri: ["A","M","V"], grow: ["M","V"], hi: [["V","A"]], len: [["A","M", half], ["M","V", h], ["V","A", slant]] },
        { t: `<strong>Angle VAM:</strong> <span class="math">tan θ = ${h} ÷ ${f2(half)}</span>, so <span class="math">θ = ${f1(ang)}°</span>.`, tri: ["A","M","V"], hi: [["V","A"]], len: [["A","M", half], ["M","V", h]], angle: ["A", "M", "V"] },
      ],
      answer: `VA = ${f1(slant)} cm · angle with the base = ${f1(ang)}°`,
      tip: `Most-lost mark: using the full diagonal AC instead of half of it. The height stands on the centre M.`,
    };
  }

  // ---------- motion: camera tween, triangle fade-in, line draw-on, edge rising ----------
  const anim = { t0: -1e9, cam: null }; let spinning = false, looping = false;
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const prog = () => ease(Math.min(1, (performance.now() - anim.t0) / 950));
  function preferredView(st) {
    const vertical = st.tri && st.tri.some((k) => ["E","F","G","H","V"].includes(k));
    if (!vertical) return { yaw: state.yaw, pitch: 1.1 };                       // flat triangle: look down on the floor
    const yaw = Math.atan2(-state.w, state.l) + 0.32;                            // stand the triangle facing the viewer
    return { yaw, pitch: 0.22 };
  }
  function startStep() {
    const st = plan().steps[state.step], to = preferredView(st);
    let dy = to.yaw - state.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    anim.cam = { fy: state.yaw, fp: state.pitch, dy, tp: to.pitch };
    anim.t0 = performance.now(); loop();
  }
  function loop() {
    if (looping) return; looping = true;
    const tick = () => {
      const t = Math.min(1, (performance.now() - anim.t0) / 950), e = ease(t);
      if (anim.cam) { state.yaw = anim.cam.fy + anim.cam.dy * e; state.pitch = anim.cam.fp + (anim.cam.tp - anim.cam.fp) * e; if (t >= 1) anim.cam = null; }
      if (spinning) state.yaw += 0.006;
      draw();
      if (t < 1 || spinning) requestAnimationFrame(tick); else looping = false;
    };
    requestAnimationFrame(tick);
  }

  // ---------- projection ----------
  function project(p, centre, W, H, scale) {
    let x = p[0] - centre[0], y = p[1] - centre[1], z = p[2] - centre[2];
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    [x, y] = [x * cy - y * sy, x * sy + y * cy];
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const depth = y * cp + z * sp, up = z * cp - y * sp;
    const persp = 1 / (1 + depth * 0.025);
    return [W / 2 + x * scale * persp, H / 2 - up * scale * persp, depth];
  }

  function resize() {
    const r = stage.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = Math.max(r.height, 380) * d;
    cv.style.height = Math.max(r.height, 380) + "px";
    ctx.setTransform(d, 0, 0, d, 0, 0);
    draw();
  }

  function draw() {
    const W = cv.width / (window.devicePixelRatio || 1), H = cv.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, W, H);
    const S = shape(), pl = plan(), st = pl.steps[state.step];
    const span = Math.max(state.l, state.w, state.h);
    const scale = Math.min(W, H) / (span * 1.9) * state.zoom;
    const Q = {}; for (const k in S.P) Q[k] = project(S.P[k], S.centre, W, H, scale);
    const pr = prog();
    // the animated copy: a "grow" edge rises from its foot to full height
    const A3 = Object.assign({}, S.P);
    if (st.grow) { const [f, g] = st.grow; A3[g] = S.P[f].map((v, i) => v + (S.P[g][i] - v) * pr); }
    const QA = {}; for (const k in A3) QA[k] = project(A3[k], S.centre, W, H, scale);
    // base face
    ctx.fillStyle = "rgba(220,232,251,.55)";
    S.faces.forEach((f) => { ctx.beginPath(); f.forEach((k, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, Q[k][0], Q[k][1])); ctx.closePath(); ctx.fill(); });
    // highlighted triangle
    if (st.tri) {
      ctx.fillStyle = `rgba(226,184,79,${(0.12 + 0.28 * pr).toFixed(3)})`; ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
      ctx.beginPath(); st.tri.forEach((k, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, QA[k][0], QA[k][1])); ctx.closePath(); ctx.fill();
      if (st.grow) { const [f, g] = st.grow; ctx.strokeStyle = C.gold; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(QA[f][0], QA[f][1]); ctx.lineTo(QA[g][0], QA[g][1]); ctx.stroke(); }
      // right-angle mark at the middle vertex
      const [a, b, c] = st.tri.map((k) => S.P[k]);
      const mark = (p0, p1, p2) => { const u = p1.map((v, i) => p0[i] + (v - p0[i]) * (0.6 / Math.hypot(...p1.map((w2, j) => w2 - p0[j])))); const v2 = p2.map((v, i) => p0[i] + (v - p0[i]) * (0.6 / Math.hypot(...p2.map((w2, j) => w2 - p0[j])))); const corner = u.map((x, i) => x + v2[i] - p0[i]); return [u, corner, v2].map((p) => project(p, S.centre, W, H, scale)); };
      const m = pr > 0.85 ? mark(b, a, c) : null;
      if (m) { ctx.strokeStyle = C.navy; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(m[0][0], m[0][1]); ctx.lineTo(m[1][0], m[1][1]); ctx.lineTo(m[2][0], m[2][1]); ctx.stroke(); }
    }
    // edges (hidden ones dashed)
    // for a cuboid, the three edges meeting at the corner farthest from the viewer are hidden
    const far = Object.keys(Q).filter((k) => k !== "M").reduce((a, b) => (Q[a][2] > Q[b][2] ? a : b));
    S.edges.forEach(([a, b]) => {
      const hidden = state.mode !== "pyramid" && (a === far || b === far);
      ctx.setLineDash(hidden ? [6, 5] : []); ctx.strokeStyle = hidden ? C.edge : C.navy; ctx.lineWidth = hidden ? 1.5 : 2.2;
      ctx.beginPath(); ctx.moveTo(Q[a][0], Q[a][1]); ctx.lineTo(Q[b][0], Q[b][1]); ctx.stroke();
    });
    ctx.setLineDash([]);
    if (state.mode === "pyramid") { ctx.setLineDash([5, 5]); ctx.strokeStyle = C.edge; ctx.beginPath(); ctx.moveTo(Q.A[0], Q.A[1]); ctx.lineTo(Q.C[0], Q.C[1]); ctx.moveTo(Q.V[0], Q.V[1]); ctx.lineTo(Q.M[0], Q.M[1]); ctx.stroke(); ctx.setLineDash([]); }
    // highlighted lines
    (st.hi || []).forEach(([a, b]) => {                                    // the line we are finding is drawn on
      const k = Math.max(0, (pr - 0.35) / 0.65), P0 = QA[a], P1 = QA[b];
      ctx.strokeStyle = C.royal; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(P0[0], P0[1]); ctx.lineTo(P0[0] + (P1[0] - P0[0]) * k, P0[1] + (P1[1] - P0[1]) * k); ctx.stroke();
    });
    // angle arc
    let html = "";
    if (st.angle && pr > 0.8) {
      const [o, base1, tip] = st.angle; const O = S.P[o];
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.1) {
        const d1 = S.P[base1].map((v, i) => v - O[i]), d2 = S.P[tip].map((v, i) => v - O[i]);
        const n1 = Math.hypot(...d1), n2 = Math.hypot(...d2);
        const dir = d1.map((v, i) => v / n1 * (1 - t) + d2[i] / n2 * t); const nd = Math.hypot(...dir);
        pts.push(project(O.map((v, i) => v + dir[i] / nd * 1.4), S.centre, W, H, scale));
      }
      ctx.strokeStyle = C.red; ctx.lineWidth = 2.5; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, p[0], p[1])); ctx.stroke();
      const mid = pts[5]; html += `<span class="label ang" style="left:${mid[0] + 22}px;top:${mid[1] - 4}px">θ</span>`;
    }
    for (const k in Q) html += `<span class="label" style="left:${Q[k][0] + (Q[k][0] > W / 2 ? 14 : -14)}px;top:${Q[k][1] + (Q[k][1] > H / 2 ? 12 : -12)}px">${k}</span>`;
    if (pr > 0.7) (st.len || []).forEach(([a, b, v]) => { const x = (Q[a][0] + Q[b][0]) / 2, y = (Q[a][1] + Q[b][1]) / 2; html += `<span class="label len" style="left:${x}px;top:${y}px">${f2(v)}</span>`; });
    labelsEl.innerHTML = html;
  }

  // ---------- panel ----------
  function renderPanel(animate = true) {
    const pl = plan();
    document.getElementById("question").innerHTML = pl.q;
    document.getElementById("steps").innerHTML = pl.steps.map((s, i) => `<li class="${i <= state.step ? "on" : ""}"><span class="num">${i + 1}</span>${s.t}</li>`).join("");
    const ans = document.getElementById("answer");
    ans.textContent = pl.answer; ans.classList.toggle("show", state.step === pl.steps.length - 1);
    document.getElementById("tip").textContent = pl.tip;
    document.getElementById("next").textContent = state.step === pl.steps.length - 1 ? "Start again ↺" : "Next step →";
    if (animate) startStep(); else draw();
  }

  function renderSliders() {
    const names = state.mode === "pyramid" ? [["l", "Base length"], ["w", "Base width"], ["h", "Height VM"]] : [["l", "Length AB"], ["w", "Width BC"], ["h", "Height CG"]];
    document.getElementById("sliders").innerHTML = names.map(([k, n]) => `<label>${n}<input type="range" min="2" max="14" step="1" value="${state[k]}" data-k="${k}"><output>${state[k]}</output></label>`).join("");
    document.querySelectorAll("#sliders input").forEach((inp) => inp.addEventListener("input", () => {
      state[inp.dataset.k] = Number(inp.value); inp.nextElementSibling.textContent = inp.value; renderPanel(false);
    }));
  }

  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    state.mode = b.dataset.mode; state.step = 0;
    document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderSliders(); renderPanel();
  }));
  document.getElementById("next").addEventListener("click", () => { const n = plan().steps.length; state.step = state.step === n - 1 ? 0 : state.step + 1; renderPanel(); });
  document.getElementById("prev").addEventListener("click", () => { state.step = Math.max(0, state.step - 1); renderPanel(); });

  // drag to rotate, wheel / pinch to zoom
  let drag = null, pinch = null;
  document.getElementById("spin").addEventListener("click", (e) => {
    spinning = !spinning; e.currentTarget.setAttribute("aria-pressed", String(spinning));
    e.currentTarget.innerHTML = spinning ? "&#10073;&#10073; Stop" : "&#9654; Spin"; if (spinning) loop();
  });
  cv.addEventListener("pointerdown", (e) => { anim.cam = null; drag = { x: e.clientX, y: e.clientY, yaw: state.yaw, pitch: state.pitch }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => {
    if (!drag) return;
    state.yaw = drag.yaw + (e.clientX - drag.x) * 0.01;
    state.pitch = Math.max(-0.2, Math.min(1.35, drag.pitch + (e.clientY - drag.y) * 0.01));
    draw();
  });
  cv.addEventListener("pointerup", () => { drag = null; });
  cv.addEventListener("wheel", (e) => { e.preventDefault(); state.zoom = Math.max(0.6, Math.min(2.2, state.zoom * (e.deltaY > 0 ? 0.92 : 1.08))); draw(); }, { passive: false });
  cv.addEventListener("touchmove", (e) => {
    if (e.touches.length !== 2) return;
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) state.zoom = Math.max(0.6, Math.min(2.2, state.zoom * d / pinch));
    pinch = d; draw();
  }, { passive: true });
  cv.addEventListener("touchend", () => { pinch = null; });
  window.addEventListener("resize", resize);

  // deep link: #diag, #plane-4, #pyramid-2 opens that case at that step (for linking from a question)
  const m = /^#(diag|plane|pyramid)(?:-(\d+))?/.exec(window.location.hash);
  if (m) {
    state.mode = m[1]; state.step = Math.max(0, Number(m[2] || 1) - 1);
    document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === state.mode)));
  }
  renderSliders(); renderPanel(); resize();
})();
</script>
</body>
</html>
